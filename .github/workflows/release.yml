# Builds a signed release APK and attaches it to a GitHub Release when a tag like v1.0.0 is pushed.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of upload-keystore.jks
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias (e.g. upload)
#   ANDROID_KEY_PASSWORD      key password
#   API_BASE_URL              the McpAi server, e.g. https://mcpai-76u1.onrender.com (must be https)
#
# Optional:
#   API_TOKEN                 Bearer token, once the server adds authentication
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          if [[ "$API_BASE_URL" != https://* ]]; then
            echo "::error::Set the API_BASE_URL secret to the server's https:// URL"; exit 1
          fi
          # Same keys as .env.example, written from the secrets.
          echo "API_BASE_URL=$API_BASE_URL" > .env
          echo "API_TOKEN=$API_TOKEN" >> .env
          VERSION="${GITHUB_REF_NAME#v}"
          flutter build apk --release --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define-from-file=.env
          mv build/app/outputs/flutter-apk/app-release.apk "ai-calculator-$GITHUB_REF_NAME.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: ai-calculator-${{ github.ref_name }}.apk
          generate_release_notes: true
